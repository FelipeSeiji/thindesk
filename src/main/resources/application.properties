spring.config.import=optional:file:./.env[.properties]
# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
spring.security.user.name=${THINDESK_USER:admin}
spring.security.user.password=${THINDESK_PASSWORD:thindesk}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG
thindesk.tecnico.username=${THINDESK_TECH_USER:tecnico}
thindesk.tecnico.password=${THINDESK_TECH_PASSWORD:tecnico123}
